# Cinematic Fog 1.2 - shaders.properties
# Modified 2026-08-02: Cinematic Fog is the default color theme for all profiles.

#ifdef IS_IRIS
iris.features.optional=CAN_DISABLE_WEATHER
#endif

# Two profiles. Source defaults match Performance, so Iris' Reset returns
# the pack to Performance.
# Performance: same look, cheaper settings. Shadows 75 blocks at 600 px,
# no colored shadows, no material gloss or water refraction, fewer AO and
# cloud steps, no cloud reflection in water, flipped-image water reflection,
# vanilla grass (custom grass off), 2K sun/moon.
# High: every effect at full quality, no limits (4K sun/moon, 255-block
# shadows at 4080 px, procedural grass).
profile.performance=SHADOW_CASTING SHADOW_QTY_SLIDER=2 SHADOW_DISTANCE_SLIDER=0 REFLECTION_SLIDER=1 !DOF DOF_STRENGTH=0.09 AO=1 AOSTEPS=2 AO_STRENGTH=0.70 AA_TYPE=2 GRASS_MODE=0 GRASS_QUALITY=0 GRASS_LOD_MODE=0 !MOTION_BLUR REFRACTION=0 SUN_REFLECTION=1 WAVING=1 V_CLOUDS=1 CLOUD_STEPS_AVG=7 CLOUD_VOL_STYLE=0 BLOOM_SAMPLES=2.0 BLOOM CHROMA_ABER=0 VOL_LIGHT=2 !CLOUD_REFLECTION WATER_ABSORPTION=0.10 COLOR_SCHEME=8 !VANILLA_WATER !COLORED_SHADOW MOTION_BLUR_SAMPLES=4 !MATERIAL_GLOSS PUDDLE_SSR_STEPS=6 SKY_TEXTURE_RES=0
profile.high=SHADOW_CASTING SHADOW_QTY_SLIDER=3 SHADOW_DISTANCE_SLIDER=2 REFLECTION_SLIDER=2 !DOF DOF_STRENGTH=0.09 AO=1 AOSTEPS=5 AO_STRENGTH=0.70 AA_TYPE=2 GRASS_MODE=1 GRASS_QUALITY=4 GRASS_LOD_MODE=2 !MOTION_BLUR REFRACTION=1 SUN_REFLECTION=1 WAVING=1 V_CLOUDS=1 CLOUD_STEPS_AVG=10 CLOUD_VOL_STYLE=0 BLOOM_SAMPLES=3.0 BLOOM CHROMA_ABER=0 VOL_LIGHT=2 CLOUD_REFLECTION WATER_ABSORPTION=0.10 COLOR_SCHEME=8 !VANILLA_WATER COLORED_SHADOW MOTION_BLUR_SAMPLES=4 MATERIAL_GLOSS PUDDLE_SSR_STEPS=16 SKY_TEXTURE_RES=1

# Default forced options
vignette = false
separateAo = false
oldLighting = false
dynamicHandLight = true
oldHandLight = false
underwaterOverlay = false
sun = false
moon = false
# Keep falling rain geometry, but remove vanilla blue ground splashes.
# The two-value form is Iris syntax; OptiFine keeps its default (rain on).
#ifdef IS_IRIS
weather = true false
#endif
frustum.culling = true
occlusion.culling = true
shadow.culling = true
# Ordinary solid terrain can use normal back-face rejection again because the
# procedural grass block now lives in the dedicated cutout program.
backFace.solid = true
# Grass ribbons remain two-sided; this affects only the smaller cutout stream.
backFace.cutout = false
backFace.cutoutMipped = false
particles.before.deferred = true

#if V_CLOUDS > 0
    clouds = off
#endif

texture.gbuffers.noisetex = textures/cinematic_fog_water_cycle_atlas_2080.png
# Sun disc: Iris accepts a custom sampler name. OptiFine only binds standard
# names, so it gets the same PNG on colortex13 (no program renders into it).
#if SKY_TEXTURE_RES == 1
    #ifdef IS_IRIS
        texture.deferred.cinematicFogSunTexture = textures/cinematic_fog_sun_4096.png
    #else
        texture.deferred.colortex13 = textures/cinematic_fog_sun_4096.png
    #endif
    texture.composite.noisetex = textures/moon_dynamic_albedo_4096.png
#else
    #ifdef IS_IRIS
        texture.deferred.cinematicFogSunTexture = textures/cinematic_fog_sun_2048.png
    #else
        texture.deferred.colortex13 = textures/cinematic_fog_sun_2048.png
    #endif
    texture.composite.noisetex = textures/moon_dynamic_albedo_2048.png
#endif

#if CLOUD_VOL_STYLE == 0
    texture.gbuffers.gaux2 = textures/clouds_natural_512_R_8bit.png
    texture.deferred.gaux2 = textures/clouds_natural_512_R_8bit.png
#else
    texture.gbuffers.gaux2 = textures/clouds_blocky_512_R_8bit.png
    texture.deferred.gaux2 = textures/clouds_blocky_512_R_8bit.png
#endif


program.shadow.enabled=SHADOW_CASTING
program.world0/shadow.enabled=SHADOW_CASTING
program.world1/shadow.enabled=SHADOW_CASTING
program.world-1/shadow.enabled=SHADOW_CASTING

# Focused controls for nearby physical density and distance simplification.
screen.columns = 1
# <profile> draws the Performance/High profile button; without it Iris hides
# the profile selector.
screen = <profile> <empty> GRASS_MODE GRASS_QUALITY GRASS_LOD_MODE

# Custom uniforms -----

# Many values are precalculated to avoid their later or repetitive calculation.

# Pixel size
uniform.float.pixelSizeX = 1.0 / viewWidth
uniform.float.pixelSizeY = 1.0 / viewHeight
uniform.float.aspectRatioInverse = 1.0 / aspectRatio

# Time constants
variable.float.hour_world = worldTime * 0.001
uniform.float.dayMoment = hour_world * 0.04166666666666667

# Day color mixer (for shadows) - This formula allows graphing the function that is calculated later.
# It allows setting values depending on the time of day. Particularly interesting are the transitions
# from day to night and vice versa, which are often used to indicate the intensity of the shadow
# (when it is produced by the moon instead of the sun), and other similar things.
# f(x) = min(-((x-.25)^2)*20 + 1.25, 1)
# g(x) = min(-((x-.75)^2)*50 + 3.125, 1)

variable.float.moment_aux = dayMoment - 0.25
variable.float.moment_aux_2 = moment_aux * moment_aux
uniform.float.dayMixer = clamp(-moment_aux_2 * 20.0 + 1.25, 0.0, 1.0)

variable.float.moment_aux_3 = dayMoment - 0.75
variable.float.moment_aux_4 = moment_aux_3 * moment_aux_3
uniform.float.nightMixer = clamp(-moment_aux_4 * 50.0 + 3.125, 0.0, 1.0)

# Day color mixer (for volumetric light) - "Similar to the previous case, but applied to values
# dependent on the time of day for volumetric lighting.

variable.float.moment_aux_5 = (dayMoment * 4.0) - 1.0
variable.float.moment_aux_6 = moment_aux_5 * moment_aux_5 * moment_aux_5 * moment_aux_5
variable.float.day_vol_mixer = clamp(((-moment_aux_6 + 1.0) * 7.0) + 1.0, 1.0, 8.0)

variable.float.moment_aux_7 = (dayMoment * 4.0) - 3.0
variable.float.moment_aux_8 = moment_aux_7 * moment_aux_7 * moment_aux_7 * moment_aux_7
variable.float.night_vol_mixer = clamp(((-moment_aux_8 + 1.0) * 7.0) + 1.0, 1.0, 8.0)

uniform.float.volumetricDayMixer = max(day_vol_mixer, night_vol_mixer)

# Light mix - Similar to the previous cases, a value that depends on the time of day
# to adjust various different parameters.
variable.float.light_mix_a = if((worldTime >= 0 && worldTime < 12485) || worldTime >= 23515, 1.0, 0.0)
variable.float.light_mix_b = if(worldTime >= 12485 && worldTime < 13085, 1.0 - ((worldTime - 12485) * 0.0016666666666666668), 0.0)
variable.float.light_mix_c = 0.0
variable.float.light_mix_d = if(worldTime >= 22915 && worldTime < 23515, (worldTime - 22915) * 0.0016666666666666668, 0.0)
variable.float.light_mix_e = max(light_mix_a, light_mix_b)
variable.float.light_mix_f = max(light_mix_c, light_mix_d)
uniform.float.dayNightMix = max(light_mix_e, light_mix_f)

# Frame modulus
uniform.int.frameMod = fmod(frameCounter, 16)

# TAA OFFSET - The offset for TAA is precalculated here.
# It is based on a pentagon (repeated twice as it is a multiple of the 10-frame module.)
# The traversal goes from one vertex of the pentagon to another at the opposite end,
# so that the traversal between different points is maximized and the images vary
# as much as possible from one to the next. It helps to make the flickering of the image
# so fast that it is "absorbed" and better masked by the TAA history.

#if AA_TYPE > 0
    uniform.vec2.taaOffset = vec2((if( \
    frameMod == 0,  0.5, \
    frameMod == 1, -0.5, \
    frameMod == 2, -0.5, \
    frameMod == 3,  0.5, \
    frameMod == 4,  0.5, \
    frameMod == 5, -0.5, \
    frameMod == 6, -0.5, \
    frameMod == 7,  0.5, \
    frameMod == 8,  0.5, \
    frameMod == 9, -0.5, \
    frameMod == 10, -0.5, \
    frameMod == 11,  0.5, \
    frameMod == 12,  0.5, \
    frameMod == 13, -0.5, \
    frameMod == 14, -0.5, \
    frameMod == 15,  0.5, \
    0.0)) * pixelSizeX, \
    (if( \
    frameMod == 0,  0.5, \
    frameMod == 1, -0.5, \
    frameMod == 2,  0.5, \
    frameMod == 3, -0.5, \
    frameMod == 4,  0.5, \
    frameMod == 5, -0.5, \
    frameMod == 6,  0.5, \
    frameMod == 7, -0.5, \
    frameMod == 8,  0.5, \
    frameMod == 9, -0.5, \
    frameMod == 10,  0.5, \
    frameMod == 11, -0.5, \
    frameMod == 12,  0.5, \
    frameMod == 13, -0.5, \
    frameMod == 14,  0.5, \
    frameMod == 15, -0.5, \
    0.0)) * pixelSizeY)

    # Dither shift - When Temporal sampling is active, dithering patterns change over time.
    # This only works in recent versions of Minecraft/Optifine/Iris.
    # For older versions, a mechanism that depends on the
    # uniform "frameMod" is used to calculate the increment.

        uniform.float.ditherShift = if( \
        frameMod == 0, 0.0625, \
        frameMod == 1, 0.4375, \
        frameMod == 2, 0.875, \
        frameMod == 3, 0.625, \
        frameMod == 4, 0.25, \
        frameMod == 5, 0.8125, \
        frameMod == 6, 0.125, \
        frameMod == 7, 0.9375, \
        frameMod == 8, 0.3125, \
        frameMod == 9, 0.5, \
        frameMod == 10, 0.375, \
        frameMod == 11, 0.5625, \
        frameMod == 12, 0.75, \
        frameMod == 13, 0.6875, \
        frameMod == 14, 0.1875, \
        frameMod == 15, 0.0, \
        0.0)
#endif

# FOV - A precalculated value related to FOV
uniform.float.fovYInverse = 1.0 / atan(1.0 / gbufferProjection.1.1) * 0.5

# float horizontalFOV = atan(1.0 / gbufferProjection[0].x);
# float verticalFOV = atan(1.0 / gbufferProjection[1].y); <-- fovYInverse

#ifdef DISTANT_HORIZONS
dhShadow.enabled = false
blend.dh_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#endif

# BLOOM Mipmap level calculation
variable.float.softBaseSize = 128.0
variable.float.softLodScale = max(1.0, viewHeight / softBaseSize)
# Optifine use 'log'. Divide with ln(2) (0.69314718)
uniform.float.softLod = max(0.0, log(softLodScale) / 0.69314718)
